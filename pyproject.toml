[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: тест с реальной сетью, только вручную",
    "needs_tesseract: нужен установленный Tesseract",
    "mytest: тест на файлах из my_test/ (пропускается без папки)",
]

[tool.ruff]
target-version = "py38"
line-length = 140
extend-exclude = [".venv", "venv", "wheels", "my_test", "my_reports"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E701", "E702", "E731", "E741"]
