name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # Windows: offscreen ищет шрифты в PyQt5/Qt5/lib/fonts (там пусто) — текст не рисуется; берём системные
      - name: Шрифты для offscreen (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "QT_QPA_FONTDIR=C:/Windows/Fonts" >> "$GITHUB_ENV"

      # Windows: обычный Python 3.8 (совпадает с целевым 3.8.10)
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.8"

      # macOS arm64: Python 3.8 через uv (в setup-python его нет для arm64)
      - uses: astral-sh/setup-uv@v5
        if: runner.os == 'macOS'
      - name: Python 3.8 через uv (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv python install 3.8
          uv venv --python 3.8 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true   # не поставился — тесты needs_tesseract пропускаются
        run: |
          choco install tesseract --no-progress -y
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Зависимости
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            uv pip install --python .venv/bin/python --no-deps -r requirements.txt
            uv pip install --python .venv/bin/python -r requirements-dev.txt
          else
            python -m pip install --upgrade pip
            python -m pip install --no-deps -r requirements.txt
            python -m pip install -r requirements-dev.txt
          fi

      - name: pytest
        shell: bash
        run: python -m pytest -q -m "not live"

      - name: ruff
        shell: bash
        run: ruff check .

      - name: vermin
        shell: bash
        run: vermin --target=3.8- --no-tips chipfinder

  portable:
    # Портативная сборка для Win7 x64: артефакт на каждый push, релиз по тегу v*
    needs: test
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:/Windows/Fonts      # offscreen без системных шрифтов не рисует текст
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: actions/cache@v4
        with:
          path: dist/cache
          key: portable-downloads-${{ hashFiles('tools/build_portable.py') }}
      - name: Сборка
        shell: bash
        run: |
          python -m pip install packaging==24.1
          python tools/build_portable.py --out dist
      - name: Пакеты импортируются встроенным Python
        shell: cmd
        run: dist\ChipFinder\python\python.exe -c "import PyQt5.QtWidgets, cv2, numpy, PIL, pypdf, bs4, requests, pytesseract, sqlite3, ssl; print('ok')"
      - name: Самопроверка встроенным Python и встроенным Tesseract
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows"
          dist\ChipFinder\python\python.exe dist\ChipFinder\run.py --selftest
      - name: PP-OCR читает образцы - проверки ppocr_check и program_ocr (встроенный Python, onnxruntime 1.11.1)
        shell: cmd
        run: |
          set "PATH=C:\Windows\system32;C:\Windows"
          dist\ChipFinder\python\python.exe tools\ci_ppocr.py dist\ChipFinder
      - name: Окно открывается из папки с русским именем и пробелом (настоящий оконный модуль Qt)
        shell: bash
        timeout-minutes: 3     # при ошибке Qt показывает окно и ждёт «OK» — шаг зависает
        run: |
          mkdir -p "dist/Мои программы"
          cp -r dist/ChipFinder "dist/Мои программы/"
          cd "dist/Мои программы/ChipFinder"
          env -u QT_QPA_PLATFORM ./python/python.exe run.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ChipFinder_portable_win7_x64
          path: dist/ChipFinder_portable_win7_x64.zip
          compression-level: 0
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChipFinder_portable_win7_x64.zip
